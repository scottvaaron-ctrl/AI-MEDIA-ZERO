name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,youtube]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: mypy
      - name: "Tests (offline: fixture LLM, silent TTS, bundled ffmpeg)"
        env:
          LLM_PROVIDER: fixture
          TTS_PROVIDER: silent
        shell: bash
        # On failure, publish the tail of the output as an annotation: annotations show on the
        # run page without signing in, the full log does not.
        run: |
          set -o pipefail
          pytest -q --cov=aimz --cov-report=term-missing 2>&1 | tee pytest-output.txt && exit 0
          code=$?
          python -c "import sys; t=open('pytest-output.txt',encoding='utf-8',errors='replace').read().splitlines()[-40:]; print('::error title=pytest failed::' + '%0A'.join(l.replace('%','%25').replace('\r','') for l in t))"
          exit $code
