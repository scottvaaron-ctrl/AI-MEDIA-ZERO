# AI Media Zero - operating configuration (owner-editable).
# Secrets and the budget live in .env, never here.

project:
  name: AI Media Zero
  timezone: America/Los_Angeles

pipeline:
  # How many fresh source items are handed to ideation per cycle.
  research_items_per_cycle: 24
  ideas_per_cycle: 8
  # How many ideas the Editor-in-Chief may select for production per cycle.
  selections_per_cycle: 2
  # Max scripts produced per cycle (bounded by hardware time, not money).
  max_productions_per_cycle: 2
  max_revision_rounds: 2
  # The Critic must score at least this (0-100) for a script to pass.
  qa_pass_threshold: 60
  # Days a source item stays "fresh" for trend-driven families.
  freshness_window_days: 14
  # A technical failure (model down, timeout) sends an idea back to the queue instead of rejecting it.
  # After this many in a row it is parked for the owner (`aimz status` lists it).
  max_technical_failures: 5
  # A render that fails is retried next cycle; after this many the script is parked for the owner.
  max_render_attempts: 3

analytics:
  # Metrics are collected until a post is this old, then its video is closed out as "measured".
  # The score itself is taken at 72 h; the rest of the window catches late views and subscribers.
  measurement_window_days: 14

scoring:
  # What counts as success: the weights of the composite score every experiment and niche is judged by.
  # OWNER DECISION: agents do not change these. retention, shares, subs, completion and reach are the
  # original score. Plan stage 6 added watch_time (watch minutes per view, the Partner Program's watch-hour
  # proxy) and revenue (revenue per 1,000 views, once monetised). They start at 0, so they are shown
  # (`aimz money`, `aimz analytics`) but change nothing until the owner raises them.
  weights:
    retention: 0.35
    shares: 0.25
    subs: 0.20
    completion: 0.20
    reach: 0.20
    watch_time: 0.15  # owner decision 2026-10-09: count how long people watch
    revenue: 0.0

allocation:
  # Cold start: mostly exploration. Moves toward exploitation as evidence accumulates.
  cold_start_explore_ratio: 0.70
  min_explore_ratio: 0.25
  # Measured videos per family before its performance estimate is trusted.
  family_confidence_sample: 5
  # Total measured videos before the exploration ratio may begin to decay.
  decay_start_sample: 12
  decay_full_sample: 60

experiments:
  # These three apply to channels without a guideline (the legacy hook_type/runtime experiments).
  default_min_sample_per_arm: 8
  max_concurrent: 2
  # Confidence required to conclude an experiment.
  min_confidence: 0.85
  # With a guideline (spec 2026-10-07 section 3) the engine fixes one experiment per channel, a win at
  # P>=0.90 with n>=10 per arm (GUIDELINE_MIN_CONFIDENCE / GUIDELINE_MIN_SAMPLE), and these:
  # a clearly worse variant is stopped at n>=safety_min_sample, n>=max_sample without a decision is inconclusive.
  safety_min_sample: 6
  max_sample: 30
  # Videos published before an item that was inconclusive or rejected may be tested again.
  cooldown_videos: 20

# `channels.starting_genres` was removed on 2026-10-07: the genre a channel makes now lives in the owner-approved
# guideline (config/guideline.md, docs/PLAN_GUIDELINE.md). Without a guideline the strategist is offered no
# starting genres and chooses one itself (aimz/identity.py).

content:
  short_form:
    # Platform limits, not a style choice: YouTube Shorts are at most 180 s. The AI picks the runtime.
    min_seconds: 10
    max_seconds: 180
    target_seconds: 45   # fallback only, for an idea saved without a runtime
    resolution: [1080, 1920]
    fps: 30
  long_form:
    enabled: false
    min_seconds: 240
    max_seconds: 900
    resolution: [1920, 1080]
  # No starting content families or hook types: the AI names its own (constitution section 8).
  # Removed by the owner on 2026-09-23; the eleven human-written starting families and six hook
  # types are in git history.
  starting_families: []
  hook_types: []

publishing:
  # Owner approval is required before anything leaves the machine.
  require_owner_approval: true
  # Failed uploads are retried automatically, but never blindly: the platform is checked first for a
  # post an earlier attempt may have made (owner decision 2026-09-28). Attempts in total, then the
  # upload is closed out ("abandoned") with an alert; `aimz publish retry <id>` re-sends it.
  max_attempts: 3
  retry_after_hours: 1
  # Owner posting limits (owner decisions 2026-09-30, and 2026-10-01 after the YouTube policy audit:
  # 2 posts per run, 2 runs a day). Agents must not edit these. Enforced in code
  # (aimz/pipeline/posting.py) for every post, retries and owner re-sends included:
  #   at most 2 posts per platform in one run; a run posts only 2.5 h after the previous posting run;
  #   at most 2 posting runs per local calendar day (so at most 4 posts per platform per day).
  # Videos that may not post yet wait, oldest first. Production pauses when more than
  # backlog_days of posts are waiting.
  limits:
    posts_per_run_per_platform: 2
    min_hours_between_runs: 2.5
    max_runs_per_day: 2
    backlog_days: 2
  ai_disclosure_text: "This video uses AI-generated narration and AI-assisted scripting. Sources are listed in the description."
  youtube:
    category_id: "27"   # Education
    made_for_kids: false
    contains_synthetic_media: true
    default_tags: []
  tiktok:
    package_dir: ./data/packages/tiktok
    recommend_ai_label: true
  bluesky:
    # Bluesky posts are capped at 300 graphemes, so the caption is title + disclosure + a few tags.
    max_hashtags: 3
    upload_captions: true   # attach the WebVTT track for accessibility

safety:
  elevated_review_topics:
    - realistic depictions of real people
    - altered real-world events
    - medical claims
    - legal claims
    - financial advice
    - politics or persuasion
    - emergencies or disasters in progress
    - allegations involving real, living people
  banned_patterns:
    - "you won't believe"
    - "doctors hate"
    - "wait for it"
    - "like and subscribe"
    - "broke the internet"
    - "changed everything"
    - "shocking truth"
    - "nobody talks about"
  # Content must cite at least this many distinct sources.
  min_sources_per_script: 1

assets:
  wikimedia:
    enabled: true
    allowed_licenses: ["pd", "cc0", "cc-by", "cc-by-sa", "public domain"]
    max_results: 6
  # Picture-matching check (SigLIP 2): a candidate is used only if its preview matches the beat, else a
  # text card. Calibrated 2026-10-08 on 50 hand-labelled pairs (docs/VIDEO_QUALITY_RESEARCH.md): the threshold is
  # a low floor that rejects only clearly unrelated pictures; ranking does most of the work: the beat gets the
  # best-scoring candidate of the first search that has one above the floor (up to 6 per source).
  # preview_width is snapped up to a width Wikimedia serves (320 -> 330).
  relevance:
    enabled: true
    text: narration       # narration | visual_query | max
    threshold: 0.00005
    by_sa_penalty: 0.05
    preview_width: 320
  # Pexels and Pixabay photos and video clips (plan stage 5). OWNER SWITCH: set enabled: true only after
  # amending the constitution's media rule (docs/PLAN_FULL_CONTROL.md section 8) and putting
  # PEXELS_API_KEY / PIXABAY_API_KEY in .env. Until then these providers are never registered.
  stock:
    enabled: false
  owner_library_dir: ./assets/owner
  cache_dir: ./data/assets

dashboard:
  title: AI Media Zero
